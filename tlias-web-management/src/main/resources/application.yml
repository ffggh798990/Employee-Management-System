
spring:
  application:
    name: tlias-web-management
  #默认激活 local 环境。真实密码放在同目录的 application-local.yml 里，那个文件在 .gitignore 中，不会提交到 GitHub。
  #别人 clone 下来没有这个文件也没关系：Spring Boot 找不到就跳过，不会报错，只是要用自己的密码。
  profiles:
    active: local
  #数据库连接信息
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: JDBC:mysql://localhost:3306/tlias
    username: root
    #密码不写死在代码里。冒号后面是本地开发的默认值，也可以设环境变量 DB_PASSWORD 覆盖
    password: ${DB_PASSWORD:your_password}
  servlet:
    multipart:
      #最大单个文件大小
      max-file-size: 10MB
      #最大请求大小（包括所有文件和表单数据的最大大小）
      max-request-size: 100MB
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    #打印日志
    #开启了驼峰映射命名的开关
    map-underscore-to-camel-case: true

#配置事务管理日志级别
logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug

#阿里云oss配置
aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucketName: java-ai-wlf0614
    region: cn-beijing
    #冒号后面要跟一个空格

